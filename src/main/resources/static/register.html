<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - DocEditor</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="auth-container">

    <div class="logo">
        Doc<span>Editor</span>
    </div>

    <h1>Create Account</h1>

    <p class="subtitle">
        Create your DocEditor account
    </p>


    <form onsubmit="register(event)">

        <label>Name</label>

        <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
        >


        <label>Email</label>

        <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
        >


        <label>Password</label>

        <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
        >


        <button type="submit">
            Create Account
        </button>

    </form>


    <p id="message" class="message"></p>


    <p class="bottom-text">
        Already have an account?

        <a href="/login.html">
            Login
        </a>
    </p>

</div>


<script src="/js/register.js"></script>

</body>
</html>
