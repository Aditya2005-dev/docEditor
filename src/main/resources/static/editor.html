<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Document Editor</title>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        /* ==============================
           TOP BAR
        ============================== */

        .topbar {
            background: #222;
            color: white;
            padding: 15px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h2 {
            margin: 0;
        }

        .status {
            font-size: 14px;
        }

        /* ==============================
           MAIN CONTAINER
        ============================== */

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        /* ==============================
           DOCUMENT INFO
        ============================== */

        .info {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;

            display: flex;
            gap: 30px;
        }

        /* ==============================
           ACTIVE USERS
        ============================== */

        .active-users {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .active-users h3 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .active-user {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 10px;
            margin-top: 8px;

            background: #f5f5f5;
            border-radius: 6px;
        }

        .user-name {
            font-weight: bold;
        }

        .user-status {
            font-size: 13px;
            font-weight: bold;
        }

        .editing {
            color: green;
        }

        .viewing {
            color: #555;
        }

        /* ==============================
           EDITOR
        ============================== */

        textarea {
            width: 100%;
            height: 500px;

            padding: 20px;

            font-size: 18px;
            line-height: 1.6;

            border: 1px solid #ccc;
            border-radius: 8px;

            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #555;
        }

        /* ==============================
           MESSAGE
        ============================== */

        .message {
            margin-top: 15px;
            padding: 12px;

            background: #fff3cd;
            border-radius: 6px;

            display: none;
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .info {
                flex-direction: column;
                gap: 10px;
            }

            .container {
                margin: 10px auto;
                padding: 10px;
            }

            textarea {
                height: 400px;
                font-size: 16px;
            }

        }

    </style>

</head>


<body>


<!-- ==========================================
     TOP BAR
========================================== -->

<div class="topbar">

    <h2>Document Editor</h2>

    <div class="status">

        Status:

        <span id="status">
            Connecting...
        </span>

    </div>

</div>


<!-- ==========================================
     MAIN CONTAINER
========================================== -->

<div class="container">


    <!-- ======================================
         DOCUMENT INFO
    ======================================= -->

    <div class="info">

        <div>

            <strong>Document:</strong>

            <span id="documentId"></span>

        </div>


        <div>

            <strong>Version:</strong>

            <span id="version">
                0
            </span>

        </div>

    </div>


    <!-- ======================================
         ACTIVE USERS
    ======================================= -->

    <div class="active-users">

        <h3>
            👥 Active Users
        </h3>

        <div id="activeUsers">

            <p>
                No active users
            </p>

        </div>

    </div>


    <!-- ======================================
         TEXT EDITOR
    ======================================= -->

    <textarea
        id="editor"
        placeholder="Start writing..."
        oninput="handleEditorInput()"
    ></textarea>


    <!-- ======================================
         MESSAGE
    ======================================= -->

    <div
        id="message"
        class="message">
    </div>


</div>


<script>


    // ==========================================
    // DOCUMENT ID
    // ==========================================

    const params =
        new URLSearchParams(
            window.location.search
        );


    const documentId =
        Number(
            params.get("id")
        );


    if (!documentId) {

        alert(
            "Invalid document ID"
        );

        window.location.href =
            "/dashboard.html";

    }


    document.getElementById(
        "documentId"
    ).innerText =
        documentId;


    // ==========================================
    // VARIABLES
    // ==========================================

    let documentVersion = 0;

    let typingTimer = null;

    let statusTimer = null;

    const debounceTime = 500;

    const statusTimeout = 2000;


    // ==========================================
    // DOM ELEMENTS
    // ==========================================

    const editor =
        document.getElementById(
            "editor"
        );


    const status =
        document.getElementById(
            "status"
        );


    const versionDisplay =
        document.getElementById(
            "version"
        );


    const messageBox =
        document.getElementById(
            "message"
        );


    const activeUsersContainer =
        document.getElementById(
            "activeUsers"
        );


    // ==========================================
    // JWT TOKEN
    // ==========================================

    const token =
        localStorage.getItem(
            "token"
        );


    if (!token) {

        alert(
            "Please login first."
        );

        window.location.href =
            "/login.html";

    }


    // ==========================================
    // GET USER EMAIL FROM JWT
    // ==========================================

    function getUserEmail() {

        if (!token) {

            console.log(
                "No JWT token found"
            );

            return "unknown";

        }


        try {

            const payload =
                token.split(".")[1];


            const decodedPayload =
                JSON.parse(

                    atob(

                        payload
                            .replace(/-/g, "+")
                            .replace(/_/g, "/")

                    )

                );


            console.log(
                "Logged in user:",
                decodedPayload.sub
            );


            return decodedPayload.sub;


        } catch (error) {

            console.error(
                "JWT decode error:",
                error
            );


            return "unknown";

        }

    }


    const userEmail =
        getUserEmail();


    // ==========================================
    // LOAD DOCUMENT
    // ==========================================

    async function loadDocument() {

        console.log(
            "Loading document..."
        );


        if (!token) {

            return;

        }


        try {

            const response =
                await fetch(

                    "/documents/" + documentId,

                    {

                        method: "GET",

                        headers: {

                            "Authorization":
                                "Bearer " + token

                        }

                    }

                );


            console.log(
                "Document response status:",
                response.status
            );


            if (!response.ok) {

                alert(
                    "Could not load document. Status: "
                    + response.status
                );

                return;

            }


            const documentData =
                await response.json();


            console.log(
                "Document loaded:",
                documentData
            );


            // ==================================
            // LOAD CONTENT
            // ==================================

            editor.value =
                documentData.content || "";


            // ==================================
            // LOAD VERSION
            // ==================================

            documentVersion =
                documentData.version == null
                    ? 0
                    : documentData.version;


            versionDisplay.innerText =
                documentVersion;


            console.log(
                "Document version:",
                documentVersion
            );


        } catch (error) {

            console.error(
                "Load document error:",
                error
            );

        }

    }


    // ==========================================
    // WEBSOCKET CLIENT
    // ==========================================

    const client =
        new StompJs.Client({

            brokerURL:
                "ws://" +
                window.location.host +
                "/ws",

            connectHeaders: {

                Authorization:
                    "Bearer " + token

            },

            reconnectDelay: 5000

        });


    // ==========================================
    // WEBSOCKET CONNECT
    // ==========================================

    client.onConnect =
        function () {

            console.log(
                "WebSocket connected"
            );


            status.innerText =
                "Connected";


            // ==================================
            // DOCUMENT EDIT SUBSCRIPTION
            // ==================================

            client.subscribe(

                "/topic/document/" +
                documentId,

                function (message) {

                    console.log(
                        "WebSocket message received:",
                        message.body
                    );


                    const data =
                        JSON.parse(
                            message.body
                        );


                    // ==================================
                    // CONFLICT
                    // ==================================

                    if (
                        data.type ===
                        "CONFLICT"
                    ) {

                        console.log(
                            "CONFLICT:",
                            data
                        );


                        documentVersion =
                            data.version;


                        versionDisplay.innerText =
                            documentVersion;


                        // Load latest server content

                        editor.value =
                            data.content || "";


                        showMessage(
                            "Conflict detected. Latest version loaded."
                        );


                        return;

                    }


                    // ==================================
                    // NORMAL EDIT
                    // ==================================

                    if (
                        data.version != null
                    ) {

                        documentVersion =
                            data.version;


                        versionDisplay.innerText =
                            documentVersion;

                    }


                    /*
                     * Only update editor if
                     * another user made the edit.
                     */

                    if (
                        data.userEmail !==
                        userEmail
                    ) {

                        editor.value =
                            data.content || "";

                    }

                }

            );


            // ==================================
            // PRESENCE SUBSCRIPTION
            // ==================================

            client.subscribe(

                "/topic/document/" +
                documentId +
                "/presence",

                function (message) {

                    console.log(
                        "Presence update:",
                        message.body
                    );


                    const users =
                        JSON.parse(
                            message.body
                        );


                    displayActiveUsers(
                        users
                    );

                }

            );


            // ==================================
            // JOIN DOCUMENT
            // ==================================

            joinDocument();

        };


    // ==========================================
    // JOIN DOCUMENT
    // ==========================================

    function joinDocument() {

        if (!client.connected) {

            return;

        }


        console.log(
            "Joining document:",
            documentId
        );


        client.publish({

            destination:
                "/app/join",

            body:
                JSON.stringify({

                    documentId:
                        documentId

                })

        });

    }


    // ==========================================
    // LEAVE DOCUMENT
    // ==========================================

    function leaveDocument() {

        if (!client.connected) {

            return;

        }


        console.log(
            "Leaving document:",
            documentId
        );


        client.publish({

            destination:
                "/app/leave",

            body:
                JSON.stringify({

                    documentId:
                        documentId

                })

        });

    }


    // ==========================================
    // UPDATE USER STATUS
    // ==========================================

    function updateUserStatus(
        newStatus
    ) {

        if (!client.connected) {

            return;

        }


        client.publish({

            destination:
                "/app/status",

            body:
                JSON.stringify({

                    documentId:
                        documentId,

                    status:
                        newStatus

                })

        });

    }


    // ==========================================
    // DISPLAY ACTIVE USERS
    // ==========================================

    function displayActiveUsers(
        users
    ) {

        activeUsersContainer.innerHTML =
            "";


        if (
            !users ||
            users.length === 0
        ) {

            activeUsersContainer.innerHTML =
                "<p>No active users</p>";

            return;

        }


        users.forEach(
            function (user) {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "active-user";


                const name =
                    user.name ||
                    user.email ||
                    "Unknown User";


                const currentStatus =
                    user.status ||
                    "VIEWING";


                const statusClass =
                    currentStatus ===
                    "EDITING"
                        ? "editing"
                        : "viewing";


                const icon =
                    currentStatus ===
                    "EDITING"
                        ? "🟢"
                        : "🔵";


                div.innerHTML = `

                    <span class="user-name">
                        ${icon} ${name}
                    </span>

                    <span class="user-status ${statusClass}">
                        ${currentStatus}
                    </span>

                `;


                activeUsersContainer
                    .appendChild(div);

            }
        );

    }


    // ==========================================
    // WEBSOCKET ERROR
    // ==========================================

    client.onWebSocketError =
        function (error) {

            console.error(
                "WebSocket error:",
                error
            );


            status.innerText =
                "Connection Error";

        };


    // ==========================================
    // WEBSOCKET CLOSE
    // ==========================================

    client.onWebSocketClose =
        function () {

            console.log(
                "WebSocket disconnected"
            );


            status.innerText =
                "Disconnected";

        };


    // ==========================================
    // HANDLE EDITOR INPUT
    // ==========================================

    function handleEditorInput() {

        console.log(
            "INPUT EVENT FIRED"
        );


        // ======================================
        // USER IS EDITING
        // ======================================

        updateUserStatus(
            "EDITING"
        );


        // ======================================
        // CLEAR OLD TIMERS
        // ======================================

        clearTimeout(
            typingTimer
        );


        clearTimeout(
            statusTimer
        );


        // ======================================
        // SEND EDIT AFTER 500ms
        // ======================================

        typingTimer =
            setTimeout(

                function () {

                    console.log(
                        "Calling sendEdit()"
                    );


                    sendEdit();

                },

                debounceTime

            );


        // ======================================
        // CHANGE BACK TO VIEWING
        // AFTER 2 SECONDS
        // ======================================

        statusTimer =
            setTimeout(

                function () {

                    updateUserStatus(
                        "VIEWING"
                    );

                },

                statusTimeout

            );

    }


    // ==========================================
    // SEND EDIT
    // ==========================================

    function sendEdit() {

        console.log(
            "sendEdit() called"
        );


        if (!client.connected) {

            console.log(
                "WebSocket not connected"
            );

            return;

        }


        const content =
            editor.value;


        console.log(
            "Sending edit:",
            {

                documentId:
                    documentId,

                userEmail:
                    userEmail,

                version:
                    documentVersion,

                content:
                    content

            }
        );


        client.publish({

            destination:
                "/app/edit",


            body:
                JSON.stringify({

                    documentId:
                        documentId,

                    userEmail:
                        userEmail,

                    content:
                        content,

                    version:
                        documentVersion,

                    type:
                        "EDIT"

                })

        });

    }


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(
        text
    ) {

        messageBox.innerText =
            text;


        messageBox.style.display =
            "block";


        setTimeout(

            function () {

                messageBox.style.display =
                    "none";

            },

            4000

        );

    }


    // ==========================================
    // PAGE CLOSE / NAVIGATION
    // ==========================================

    window.addEventListener(
        "beforeunload",
        function () {

            leaveDocument();

        }
    );


    // ==========================================
    // START WEBSOCKET
    // ==========================================

    client.activate();


    // ==========================================
    // LOAD DOCUMENT
    // ==========================================

    loadDocument();


</script>


</body>

</html>
