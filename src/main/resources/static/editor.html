<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Document Editor</title>

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .topbar {
            background: #222;
            color: white;
            padding: 15px 20px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status {
            font-size: 14px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .info {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;

            display: flex;
            gap: 30px;
        }

        textarea {
            width: 100%;
            height: 500px;

            padding: 20px;

            font-size: 18px;
            line-height: 1.6;

            border: 1px solid #ccc;
            border-radius: 8px;

            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: #555;
        }

        .message {
            margin-top: 15px;
            padding: 12px;

            background: #fff3cd;
            border-radius: 6px;

            display: none;
        }

    </style>

</head>


<body>

<div class="topbar">

    <h2>Document Editor</h2>

    <div class="status">
        Status:
        <span id="status">Connecting...</span>
    </div>

</div>


<div class="container">

    <div class="info">

        <div>
            <strong>Document:</strong>
            <span id="documentId"></span>
        </div>

        <div>
            <strong>Version:</strong>
            <span id="version">0</span>
        </div>

    </div>


    <textarea
            id="editor"
            placeholder="Start writing..."
            oninput="handleEditorInput()"
    ></textarea>


    <div
            id="message"
            class="message">
    </div>

</div>


<script>

    // ==========================================
    // DOCUMENT
    // ==========================================

    const documentId = 2;

    document.getElementById("documentId").innerText =
        documentId;


    // ==========================================
    // VARIABLES
    // ==========================================

    let documentVersion = 0;

    let typingTimer = null;

    const debounceTime = 500;


    const editor =
        document.getElementById("editor");

    const status =
        document.getElementById("status");

    const versionDisplay =
        document.getElementById("version");

    const messageBox =
        document.getElementById("message");


    // ==========================================
    // GET EMAIL FROM JWT
    // ==========================================

    function getUserEmail() {

        const token =
            localStorage.getItem("token");

        if (!token) {

            console.log("No JWT token found");

            return "unknown";
        }

        try {

            const payload =
                token.split(".")[1];

            const decodedPayload =
                JSON.parse(
                    atob(
                        payload
                            .replace(/-/g, "+")
                            .replace(/_/g, "/")
                    )
                );

            console.log(
                "Logged in user:",
                decodedPayload.sub
            );

            return decodedPayload.sub;

        } catch (error) {

            console.error(
                "JWT decode error:",
                error
            );

            return "unknown";
        }
    }


    const userEmail =
        getUserEmail();


    // ==========================================
    // LOAD DOCUMENT
    // ==========================================

    async function loadDocument() {

        console.log(
            "Loading document..."
        );

        const token =
            localStorage.getItem("token");

        if (!token) {

            alert(
                "Please login first."
            );

            window.location.href =
                "/login.html";

            return;
        }


        try {

            const response =
                await fetch(
                    "/documents/" + documentId,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                "Bearer " + token
                        }
                    }
                );


            console.log(
                "Document response status:",
                response.status
            );


            if (!response.ok) {

                alert(
                    "Could not load document. Status: "
                    + response.status
                );

                return;
            }


            const document =
                await response.json();


            console.log(
                "Document loaded:",
                document
            );


            // Content
            editor.value =
                document.content || "";


            // Version
            documentVersion =
                document.version == null
                    ? 0
                    : document.version;


            versionDisplay.innerText =
                documentVersion;


            console.log(
                "Document version:",
                documentVersion
            );

        } catch (error) {

            console.error(
                "Load document error:",
                error
            );
        }
    }


    // ==========================================
    // WEBSOCKET
    // ==========================================

    const client =
        new StompJs.Client({

            brokerURL:
                "ws://localhost:8080/ws",

            reconnectDelay: 5000
        });


    // ==========================================
    // CONNECT
    // ==========================================

    client.onConnect =
        function () {

            console.log(
                "WebSocket connected"
            );

            status.innerText =
                "Connected";


            client.subscribe(
                "/topic/document/" + documentId,

                function (message) {

                    console.log(
                        "WebSocket message received:",
                        message.body
                    );


                    const data =
                        JSON.parse(
                            message.body
                        );


                    // ==================================
                    // CONFLICT
                    // ==================================

                    if (
                        data.type === "CONFLICT"
                    ) {

                        console.log(
                            "CONFLICT:",
                            data
                        );


                        documentVersion =
                            data.version;


                        versionDisplay.innerText =
                            documentVersion;


                        /*
                         * Load latest server content.
                         */

                        editor.value =
                            data.content || "";


                        showMessage(
                            "Conflict detected. Latest version loaded."
                        );


                        return;
                    }


                    // ==================================
                    // NORMAL EDIT
                    // ==================================

                    if (
                        data.version != null
                    ) {

                        documentVersion =
                            data.version;


                        versionDisplay.innerText =
                            documentVersion;
                    }


                    /*
                     * Only update editor if
                     * another user made the edit.
                     */

                    if (
                        data.userEmail !== userEmail
                    ) {

                        editor.value =
                            data.content || "";
                    }

                }
            );
        };


    // ==========================================
    // WEBSOCKET ERROR
    // ==========================================

    client.onWebSocketError =
        function (error) {

            console.error(
                "WebSocket error:",
                error
            );

            status.innerText =
                "Connection Error";
        };


    // ==========================================
    // WEBSOCKET CLOSE
    // ==========================================

    client.onWebSocketClose =
        function () {

            console.log(
                "WebSocket disconnected"
            );

            status.innerText =
                "Disconnected";
        };


    // ==========================================
    // HANDLE INPUT
    // ==========================================

    function handleEditorInput() {

        console.log(
            "INPUT EVENT FIRED"
        );


        clearTimeout(
            typingTimer
        );


        typingTimer =
            setTimeout(
                function () {

                    console.log(
                        "Calling sendEdit()"
                    );

                    sendEdit();

                },
                debounceTime
            );
    }


    // ==========================================
    // SEND EDIT
    // ==========================================

    function sendEdit() {

        console.log(
            "sendEdit() called"
        );


        if (!client.connected) {

            console.log(
                "WebSocket not connected"
            );

            return;
        }


        const content =
            editor.value;


        console.log(
            "Sending edit:",
            {
                documentId:
                    documentId,

                userEmail:
                    userEmail,

                version:
                    documentVersion,

                content:
                    content
            }
        );


        client.publish({

            destination:
                "/app/edit",

            body:
                JSON.stringify({

                    documentId:
                        documentId,

                    userEmail:
                        userEmail,

                    content:
                        content,

                    version:
                        documentVersion,

                    type:
                        "EDIT"
                })
        });
    }


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(text) {

        messageBox.innerText =
            text;

        messageBox.style.display =
            "block";


        setTimeout(
            function () {

                messageBox.style.display =
                    "none";

            },
            4000
        );
    }


    // ==========================================
    // START
    // ==========================================

    client.activate();

    loadDocument();

</script>

</body>

</html>
