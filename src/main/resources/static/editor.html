<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document Editor - DocEditor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

</head>


<body>

<div class="editor-shell">


<!-- ==========================================
     TOP BAR
=========================================== -->

<header class="editor-topbar">

    <div class="editor-topbar-left">

        <button class="btn-ghost btn-sm" onclick="window.location.href='/dashboard.html'">
            &larr; Back
        </button>

        <div class="editor-divider"></div>

        <span class="editor-title" id="documentTitle">Document</span>

    </div>

    <div class="editor-topbar-right">

        <div class="avatar-stack" id="avatarStack"></div>

        <span class="connection-pill">
            <span class="status-dot" id="statusDot"></span>
            <span id="status">Connecting...</span>
        </span>

    </div>

</header>



<!-- ==========================================
     MAIN
=========================================== -->

<div class="editor-page">

    <!-- conflict message -->
    <div id="message" class="editor-banner"></div>

    <!-- viewer-only notice -->
    <div id="viewerBanner" class="viewer-banner">
        You have view-only access to this document.
    </div>


    <!-- active users -->
    <div class="presence-row" id="activeUsers"></div>
    <p class="presence-empty" id="activeUsersEmpty">No other active users</p>


    <!-- editor -->
    <div class="editor-paper">
        <textarea
            id="editor"
            class="editor-textarea"
            placeholder="Start writing..."
            oninput="handleEditorInput()"
        ></textarea>
    </div>

</div>

</div>


<script src="/js/editor.js"></script>


</body>

</html>
