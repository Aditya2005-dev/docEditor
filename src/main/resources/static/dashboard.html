<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - DocEditor</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<div class="dashboard">


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="dashboard-header">

        <div>

            <div class="logo">
                Doc<span>Editor</span>
            </div>

            <p class="dashboard-subtitle">
                Your documents
            </p>

        </div>


        <button
            class="logout-button"
            onclick="logout()"
        >
            Logout
        </button>

    </header>


    <!-- ==========================================
         CREATE DOCUMENT
    =========================================== -->

    <section class="create-section">

        <h2>
            Create New Document
        </h2>


        <input
            type="text"
            id="title"
            placeholder="Document title"
        >


        <textarea
            id="content"
            placeholder="Start writing..."
        ></textarea>


        <button
            onclick="createDocument()"
        >
            Create Document
        </button>


        <p id="createMessage"></p>

    </section>


    <!-- ==========================================
         DOCUMENTS
    =========================================== -->

    <section class="documents-section">


        <div class="section-header">

            <h2>
                My Documents
            </h2>


            <button
                onclick="loadDocuments()"
            >
                Refresh
            </button>

        </div>


        <div id="documents">

            <p class="loading">
                Loading documents...
            </p>

        </div>


    </section>


</div>


<!-- ==========================================
     JAVASCRIPT
=========================================== -->

<script src="/js/dashboard.js"></script>


</body>

</html>
