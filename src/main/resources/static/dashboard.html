<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - DocEditor</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="dashboard">

    <!-- Header -->

    <header class="dashboard-header">

        <div>

            <div class="logo">
                Doc<span>Editor</span>
            </div>

            <p class="dashboard-subtitle">
                Your documents
            </p>

        </div>

        <button
                class="logout-button"
                onclick="logout()"
        >
            Logout
        </button>

    </header>


    <!-- Create Document -->

    <section class="create-section">

        <h2>Create New Document</h2>

        <input
                type="text"
                id="title"
                placeholder="Document title"
        >

        <textarea
                id="content"
                placeholder="Start writing..."
        ></textarea>

        <button onclick="createDocument()">
            Create Document
        </button>

        <p id="createMessage"></p>

    </section>


    <!-- Documents -->

    <section class="documents-section">

        <div class="section-header">

            <h2>My Documents</h2>

            <button onclick="loadDocuments()">
                Refresh
            </button>

        </div>

        <div id="documents">

            <p class="loading">
                Loading documents...
            </p>

        </div>

    </section>


    <!-- Editor -->

    <section
            id="editor"
            class="editor-section"
            style="display: none;"
    >

        <div class="section-header">

            <h2>Edit Document</h2>

            <button
                    class="close-button"
                    onclick="closeEditor()"
            >
                Close
            </button>

        </div>


        <input
                type="text"
                id="editTitle"
                placeholder="Document title"
        >


        <textarea
                id="editContent"
                placeholder="Document content"
        ></textarea>


        <div class="editor-buttons">

            <button onclick="updateDocument()">
                Save Changes
            </button>

            <button
                    class="danger"
                    onclick="deleteDocument()"
            >
                Delete Document
            </button>

        </div>


        <p id="editMessage"></p>

    </section>

</div>


<script src="/js/dashboard.js"></script>

</body>
</html>
