<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log in - DocEditor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="auth-layout">

    <!-- LEFT: brand panel -->
    <div class="auth-side">
        <div class="auth-side-inner">

            <div class="brand brand--on-dark">
                <span class="brand-mark">D</span>
                <span class="brand-name">DocEditor</span>
            </div>

            <h1>Real-time documents,<br>made for teams.</h1>

            <ul>
                <li>Real-time multi-user editing</li>
                <li>Share documents as viewer or editor</li>
                <li>See who's active on a document, live</li>
            </ul>

            <div class="auth-doc-shape">
                <span></span>
                <span></span>
            </div>

        </div>
    </div>

    <!-- RIGHT: form -->
    <div class="auth-form-side">
        <div class="auth-card">

            <div class="brand">
                <span class="brand-mark">D</span>
                <span class="brand-name">DocEditor</span>
            </div>

            <h2>Welcome back</h2>
            <p class="subtitle">Log in to your account</p>

            <form onsubmit="login(event)">

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-primary btn-block">Log in</button>

            </form>

            <p id="message" class="form-message"></p>

            <p class="bottom-text">
                Don't have an account?
                <a href="/register.html">Create one</a>
            </p>

        </div>
    </div>

</div>

<script src="/js/login.js"></script>

</body>
</html>
